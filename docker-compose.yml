version: '3.8'

services:
  backend:
    build: .
    # Ejecutamos FastAPI permitiendo conexiones externas (0.0.0.0)
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Mapeamos las carpetas locales para no perder la base de datos ni los PDFs al apagar el contenedor
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  frontend:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env